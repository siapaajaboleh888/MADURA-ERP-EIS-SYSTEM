name: Madura ERP CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Test Suite (PHP 8.4 & Laravel 12)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite3, pdo_sqlite, bcmath
          coverage: none

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Copy .env and Generate Key
        working-directory: ./backend
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate

      - name: Execute Migrations and Seeders
        working-directory: ./backend
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate:fresh --seed --force

      - name: Run Backend Unit & Feature Tests
        working-directory: ./backend
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test

  frontend-build:
    name: Frontend Lint & Build (Next.js 16)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js Application
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api
        run: npm run build
