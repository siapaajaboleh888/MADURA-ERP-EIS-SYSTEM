services:
  postgres:
    image: postgres:16-alpine
    container_name: madura_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: madura_erp
      POSTGRES_USER: madura_user
      POSTGRES_PASSWORD: secret_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: madura_backend
    restart: unless-stopped
    environment:
      APP_NAME: "Madura ERP"
      APP_ENV: production
      APP_KEY: base64:Z123456789012345678901234567890123456789012=
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: madura_erp
      DB_USERNAME: madura_user
      DB_PASSWORD: secret_password
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    command: php artisan serve --host=0.0.0.0 --port=8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: madura_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: madura_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deployment/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
